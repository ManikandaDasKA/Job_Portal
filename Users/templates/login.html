{% extends "base.html" %}

{% block title %}Log in - JobPortal{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .form-group { margin-bottom: 20px; }

    label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
    }

    #login-error {
        display: none;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        font-size: 0.875rem;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-submit:disabled { opacity: 0.7; }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in</p>
        </div>

        <div id="login-error" role="alert"></div>

        <form id="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">Email Address</label>
                <input type="email" id="id_email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" id="id_password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Sign In</button>
        </form>
        
        <div style="text-align: center; margin-top: 16px;">
            <a href="/users/registration/" style="color: #4f46e5; font-size: 0.875rem; text-decoration: none;">
                Don't have an account? Sign up
            </a>
        </div>
    </div>
</div>

<script>
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('login-error');

    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        
        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerText = 'Signing in...';

        const email = document.getElementById('id_email').value;
        const password = document.getElementById('id_password').value;

        try {
            const response = await fetch('/users/login-test/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': window.getCookie('csrftoken')
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // 1. Assign the short-lived access token directly to RAM space
                window.accessToken = data.access;
                
                // Keep minimal layout info in localStorage if needed, but NEVER tokens
                localStorage.setItem('user_email', email);

                // 2. Relocate to main interface
                window.location.href = '/users/dashboard/';
            } else {
                errorBox.innerText = data.detail || 'Login failed. Please check your credentials.';
                errorBox.style.display = 'block';
            }
        } catch (err) {
            errorBox.innerText = 'Server connection error. Please try again later.';
            errorBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign In';
        }
    };
</script>
{% endblock %}
