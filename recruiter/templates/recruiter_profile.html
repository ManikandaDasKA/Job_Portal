{% extends 'base.html' %}

{% block title %}My Recruiter Profile - JobPortal{% endblock %}

{% block content %}
<style>
    /* --- PROFILE COMPONENT STYLES --- */
    .profile-container {
        background-color: #ffffff;
        width: 100%;
        max-width: 650px;
        margin: 0 auto; 
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid var(--border-color);
    }

    .profile-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .profile-header h1 {
        margin: 0;
        font-size: 1.75rem;
        color: var(--nav-text);
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .profile-header p {
        margin: 8px 0 0;
        font-size: 0.95rem;
        color: #6b7280;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-row {
        display: flex;
        gap: 20px;
    }

    .form-row .form-group {
        flex: 1;
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
        transition: all 0.2s ease;
        background-color: #f9fafb;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--nav-accent);
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); 
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: var(--nav-accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        margin-top: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 50px;
    }

    .btn-submit:hover {
        background-color: #4338ca; 
    }
    
    .btn-submit:active {
        transform: scale(0.98);
    }

    .status-message {
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
        display: none;
    }

    .status-success {
        background-color: #d1fae5;
        color: #065f46;
        border: 1px solid #34d399;
        display: block;
    }

    .status-error {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        display: block;
    }

    /* Loading Spinner */
    .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { 
        to { transform: rotate(360deg); } 
    }
    
    .loading .spinner { display: block; }
    .loading .btn-text { display: none; }
    .loading { opacity: 0.8; cursor: not-allowed; pointer-events: none; }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
        .form-row {
            flex-direction: column;
            gap: 0;
        }
        .profile-container {
            padding: 20px;
            box-shadow: none;
            border: none;
            border-radius: 0;
            background-color: transparent;
        }
    }
</style>

<div class="profile-container">
    <div class="profile-header">
        <h1 id="pageTitle">My Recruiter Profile</h1>
        <p id="pageSubtitle">Loading your details...</p>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <form id="profileForm" onsubmit="handleFormSubmit(event)">
        
        <div class="form-row">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Jane Doe">
            </div>
            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" placeholder="e.g. Senior Recruiter">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="+1 234 567 8900">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
            <span class="btn-text">Save Profile</span>
            <div class="spinner"></div>
        </button>
    </form>
</div>

<script>
    // 1. UPDATED CONFIGURATION: Split into two endpoints
    const PROFILE_CREATE_ENDPOINT = `/recruiter/`;          // Used for POST
    const PROFILE_READ_UPDATE_ENDPOINT = `/recruiter/me/`;  // Used for GET and PATCH
    
    // State Tracker
    let isExistingProfile = false;

    // Use window.authCheckPromise from base.html to ensure the token is loaded before fetching
    document.addEventListener("DOMContentLoaded", () => {
        if (window.authCheckPromise) {
            window.authCheckPromise.then(() => {
                fetchProfile();
            });
        } else {
            fetchProfile(); 
        }
    });

    // Fetch existing profile data
    async function fetchProfile() {
        try {
            // 2. UPDATED FETCH: Remove ${window.userId} and use the 'me' endpoint
            const response = await window.authFetch(PROFILE_READ_UPDATE_ENDPOINT, {
                method: "GET"
            });

            if (response.ok) {
                const data = await response.json();
                
                // If data exists, populate the form
                if (data && Object.keys(data).length > 0) {
                    isExistingProfile = true;
                    document.getElementById("pageSubtitle").textContent = "Update your professional details below.";
                    document.querySelector(".btn-text").textContent = "Update Profile";
                    
                    // Populate fields directly matching your model fields
                    document.getElementById("fullName").value = data.full_name || "";
                    document.getElementById("designation").value = data.designation || "";
                    document.getElementById("phoneNumber").value = data.phone_number || "";
                    document.getElementById("gender").value = data.gender || "";
                }
            } else if (response.status === 404) {
                // No profile found - Form acts as a Create form
                isExistingProfile = false;
                document.getElementById("pageSubtitle").textContent = "Create your professional profile to get started.";
                document.querySelector(".btn-text").textContent = "Create Profile";
            } else {
                throw new Error("Failed to fetch profile");
            }
        } catch (error) {
            console.error("Profile Fetch Error:", error);
            document.getElementById("pageSubtitle").textContent = "Please fill out the form below.";
        }
    }

    // Handle Form Submission (Create or Update)
    async function handleFormSubmit(event) {
        event.preventDefault(); 
        
        const btn = document.getElementById("submitBtn");
        const statusBox = document.getElementById("statusMessage");
        
        // Trigger UI Loading State
        btn.classList.add("loading");
        statusBox.className = "status-message"; 
        statusBox.textContent = "";

        // Build Payload
        const payload = {
            full_name: document.getElementById("fullName").value,
            designation: document.getElementById("designation").value,
            phone_number: document.getElementById("phoneNumber").value,
            gender: document.getElementById("gender").value
        };

        // 3. UPDATED LOGIC: Dynamically choose the correct HTTP Method AND Endpoint
        const method = isExistingProfile ? "PATCH" : "POST";
        const targetEndpoint = isExistingProfile ? PROFILE_READ_UPDATE_ENDPOINT : PROFILE_CREATE_ENDPOINT;

        try {
            const response = await window.authFetch(targetEndpoint, {
                method: method,
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                statusBox.textContent = isExistingProfile ? "Profile updated successfully!" : "Profile created successfully!";
                statusBox.classList.add("status-success");
                
                if (!isExistingProfile) {
                    isExistingProfile = true;
                    document.querySelector(".btn-text").textContent = "Update Profile";
                }
            } else {
                // NEW: Read the exact validation errors from Django
                console.log("Server rejected the data:", data);
                
                let errorMessage = "Error saving profile. Please check your inputs.";
                
                // If Django sent specific field errors (e.g., {"phone_number": ["Ensure this field has no more than 15 characters."]})
                if (data.errors) {
                    // Convert the error object into a readable string
                    const errorMessages = Object.entries(data.errors)
                        .map(([field, msgs]) => `${field}: ${msgs.join(', ')}`)
                        .join(' | ');
                    errorMessage = `Validation Error -> ${errorMessages}`;
                } else if (data.detail) {
                    errorMessage = data.detail;
                }

                statusBox.textContent = errorMessage;
                statusBox.classList.add("status-error");
            }
        } catch (error) {
            console.error("Save Error:", error);
            statusBox.textContent = "Network error. Please try again later.";
            statusBox.classList.add("status-error");
        } finally {
            // Remove UI Loading State
            btn.classList.remove("loading");
        }
    }
</script>
{% endblock %}
