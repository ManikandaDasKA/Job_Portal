<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Hub</title>
<style>
    :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --unread-bg: #eff6ff;
        --border-color: #e2e8f0;
        --read-badge-bg: #f1f5f9;
        --read-badge-text: #64748b;
    }

    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        color: var(--text-main);
    }

    /* Notification Bell & Badge */
    .nav-container {
        display: flex;
        justify-content: flex-end;
        max-width: 800px;
        margin: 0 auto 20px;
        position: relative;
    }

    .bell-wrapper {
        position: relative;
        cursor: pointer;
        padding: 10px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }

    .bell-wrapper:hover {
        transform: scale(1.05);
    }

    .bell-icon {
        font-size: 1.5rem;
    }

    .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        background: #ef4444;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
        height: 20px;
        min-width: 20px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid white;
        display: none;
    }

    /* Notification Panel */
    .notification-panel {
        max-width: 800px;
        margin: 0 auto;
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        border: 1px solid var(--border-color);
        overflow: hidden;
    }

    .panel-header {
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .panel-header h2 {
        margin: 0;
        font-size: 1.25rem;
    }

    .refresh-btn {
        background: none;
        border: none;
        color: var(--primary);
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
    }

    .refresh-btn:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }

    .notification-list {
        max-height: 600px;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    /* Individual Notification Item */
    .notification-item {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color 0.2s;
    }

    .notification-item.unread {
        background-color: var(--unread-bg);
        border-left: 4px solid var(--primary);
    }

    .notification-content {
        flex: 1;
        padding-right: 15px;
    }

    .notification-title {
        margin: 0 0 5px 0;
        font-size: 1rem;
        font-weight: 600;
    }

    .notification-message {
        margin: 0 0 8px 0;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    .notification-time {
        font-size: 0.75rem;
        color: #94a3b8;
    }

    .mark-read-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
        transition: background-color 0.2s;
    }

    .mark-read-btn:hover {
        background: var(--primary-hover);
    }

    /* Read Status Badge */
    .read-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 10px;
        background-color: var(--read-badge-bg);
        color: var(--read-badge-text);
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        white-space: nowrap;
        user-select: none;
    }

    .empty-state {
        padding: 40px;
        text-align: center;
        color: var(--text-muted);
    }

    .loader {
        text-align: center;
        padding: 30px;
        color: var(--text-muted);
    }
</style>
</head>
<body>

    <div class="nav-container">
        <div class="bell-wrapper" onclick="loadNotifications()">
            <span class="bell-icon">🔔</span>
            <span class="badge" id="unread-badge">0</span>
        </div>
    </div>

    <div class="notification-panel">
        <div class="panel-header">
            <h2>Notifications</h2>
            <button class="refresh-btn" onclick="loadNotifications()">↻ Refresh</button>
        </div>
        <div id="notification-container">
            <div class="loader">Loading notifications...</div>
        </div>
    </div>

    <input type="hidden" name="csrfmiddlewaretoken" value="YOUR_CSRF_TOKEN_HERE">

<script>
    const BASE_URL = window.location.origin;
    const API_PREFIX = "/notification"; 

    function getAuthToken() {
        return window.accessToken || localStorage.getItem('access_token') || '';
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadUnreadCount();
        loadNotifications();
    });

    async function apiFetch(endpoint, options = {}) {
        const fetchFn = window.authFetch || fetch;
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value 
                          || document.cookie.match(/csrftoken=([^;]+)/)?.[1] 
                          || '';

        const token = getAuthToken();
        const defaultHeaders = {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
        };

        if (token) {
            defaultHeaders['Authorization'] = `Bearer ${token}`;
        }

        if (options.method && options.method !== 'GET') {
            defaultHeaders['X-CSRFToken'] = csrfToken;
        }

        options.headers = { ...defaultHeaders, ...options.headers };
        options.credentials = 'include';

        try {
            const response = await fetchFn(`${BASE_URL}${API_PREFIX}${endpoint}`, options);
            if (!response.ok) {
                console.error(`HTTP error: ${response.status}`);
                return null;
            }
            return await response.json();
        } catch (error) {
            console.error("API Fetch Error:", error);
            return null;
        }
    }

    async function loadUnreadCount() {
        const data = await apiFetch('/unread-count/');
        if (data && data.success) {
            updateBadge(data.unread_count);
        }
    }

    function updateBadge(count) {
        const badge = document.getElementById('unread-badge');
        if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
            badge.textContent = '0';
        }
    }

    // Helper: checks whether notification is read across any common backend convention
    function checkIsRead(notif) {
        return (
            notif.is_read === true ||
            notif.is_read === 1 ||
            notif.is_read === "true" ||
            notif.read === true ||
            notif.read === 1 ||
            notif.status === "read" ||
            notif.message_status === "read" ||
            String(notif.is_read).toLowerCase() === "true"
        );
    }

    async function loadNotifications() {
        const container = document.getElementById('notification-container');
        container.innerHTML = '<div class="loader">Loading notifications...</div>';

        // Updated from apiFetch('/') to match your route path('list/view/', ...)
        const data = await apiFetch('/list/view/');
        
        if (!data || !data.success) {
            container.innerHTML = '<div class="empty-state">Failed to load notifications.</div>';
            return;
        }

        const notifications = data.data || [];

        if (notifications.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 2rem; margin-bottom: 10px;">📭</div>
                    You're all caught up! No notifications yet.
                </div>`;
            return;
        }

        const listHtml = document.createElement('ul');
        listHtml.className = 'notification-list';

        notifications.forEach(notif => {
            const isRead = checkIsRead(notif);
            const isUnread = !isRead;

            const dateStr = notif.created_at ? new Date(notif.created_at).toLocaleString() : '';
            const notifId = notif.id || notif.notification_id;

            const li = document.createElement('li');
            li.className = `notification-item ${isUnread ? 'unread' : ''}`;
            li.id = `notif-${notifId}`;

            li.innerHTML = `
                <div class="notification-content">
                    <h4 class="notification-title">${escapeHtml(notif.title || 'Notification')}</h4>
                    <p class="notification-message">${escapeHtml(notif.message || '')}</p>
                    <span class="notification-time">${dateStr}</span>
                </div>
                <div class="notification-action" id="action-${notifId}">
                    ${isRead 
                        ? `<span class="read-status-badge">✓ Read</span>` 
                        : `<button class="mark-read-btn" onclick="markAsRead('${notifId}', this)">Mark as Read</button>`
                    }
                </div>
            `;
            listHtml.appendChild(li);
        });

        container.innerHTML = '';
        container.appendChild(listHtml);
    }
    
    async function markAsRead(notificationId, btnElement) {
        const originalText = btnElement.textContent;
        btnElement.textContent = "Updating...";
        btnElement.disabled = true;

        const data = await apiFetch(`/${notificationId}/read/`, {
            method: 'PATCH',
            body: JSON.stringify({})
        });

        if (data && data.success) {
            // Remove the left border and blue highlight
            const listItem = document.getElementById(`notif-${notificationId}`);
            if (listItem) {
                listItem.classList.remove('unread');
                listItem.style.borderLeft = "none";
            }

            // Immediately switch from the button to the "✓ Read" badge
            const actionContainer = document.getElementById(`action-${notificationId}`);
            if (actionContainer) {
                actionContainer.innerHTML = '<span class="read-status-badge">✓ Read</span>';
            }
            
            // Decrement badge count
            const badge = document.getElementById('unread-badge');
            let currentCount = parseInt(badge.textContent) || 0;
            if (currentCount > 0) {
                updateBadge(currentCount - 1);
            }
        } else {
            alert("Failed to mark as read. Please try again.");
            btnElement.textContent = originalText;
            btnElement.disabled = false;
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
